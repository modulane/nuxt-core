name: CI

# Work happens on branches and reaches main through pull requests, so CI runs
# on every pull request, not twice for each branch push. On main, the Release
# workflow calls this workflow before releasing, so the commit it tests is
# the commit it releases, in the same run.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read # check out the code

# A new push to a pull request cancels the run it replaces. When Release calls
# this workflow, each run gets its own group, so CI on main is never cancelled.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        # The even-numbered (LTS) lines that package.json "engines" allows.
        node-version:
          - 22
          - 24
          - 26

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Corepack provides the Yarn version pinned in package.json
      # "packageManager". It must be enabled before setup-node, which runs
      # Yarn to find its cache. Node.js 25 and later no longer include
      # Corepack, so it comes from the runner's default Node.js.
      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: yarn

      # Also runs "nuxt prepare" (postinstall), which generates the types
      # the type check needs.
      - name: Install dependencies
        run: yarn install --immutable

      - name: Run checks and tests
        run: yarn check

      - name: Build
        run: yarn build

  coverage:
    name: Code coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run tests with coverage
        run: yarn coverage

      - name: Generate coverage badge
        run: node scripts/generate-coverage-badge.js

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: coverage/badge

  # The one CI check the main ruleset requires, so adding or dropping a Node.js
  # version in the matrix never means editing the ruleset. It runs even when a
  # job it needs fails or is cancelled, because GitHub treats a skipped
  # required check as passing.
  ci-passed:
    name: CI passed
    if: always()
    needs: [test, coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions: {}

    steps:
      - name: Check that every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          if [ -z "$RESULTS" ]; then
            echo "::error::No job results to check."
            exit 1
          fi
          for result in $RESULTS; do
            if [ "$result" != success ]; then
              echo "::error::A required job ended with \"$result\"."
              exit 1
            fi
          done

  deploy-badge:
    name: Deploy coverage badge
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      pages: write # publish the badge to GitHub Pages
      id-token: write # prove to Pages that the deployment comes from this run

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
