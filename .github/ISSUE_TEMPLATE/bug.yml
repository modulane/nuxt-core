name: Bug
description: Something doesn't work as expected
labels: ['bug', 'needs-triage']
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Click on …
        3. See …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser / device
      placeholder: Chrome 140, Windows 11 — or iPhone, Safari
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Drag and drop images here if relevant.
  - type: dropdown
    id: ai-use
    attributes:
      label: AI use
      description: Required, for everyone. Say whether AI tools helped write this issue.
      options:
        - No AI tool was used
        - AI tools were used
    validations:
      required: true
  - type: textarea
    id: ai-tools
    attributes:
      label: AI tools used
      description: If AI tools were used, name each one and what it did, for example "ChatGPT summarised the error log".
