name: Question
description: Ask how to use Nuxt Core
labels: ['question', 'needs-triage']
body:
  - type: textarea
    id: question
    attributes:
      label: Question
      description: What are you trying to do, and what have you tried? Check the [documentation](https://github.com/modulane/nuxt-core/blob/main/docs/README.md) first.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Nuxt Core version
      placeholder: v0.4.0
  - type: dropdown
    id: ai-use
    attributes:
      label: AI use
      description: Required, for everyone. Say whether AI tools helped write this issue.
      options:
        - No AI tool was used
        - AI tools were used
    validations:
      required: true
  - type: textarea
    id: ai-tools
    attributes:
      label: AI tools used
      description: If AI tools were used, name each one and what it did, for example "ChatGPT summarised the error log".
